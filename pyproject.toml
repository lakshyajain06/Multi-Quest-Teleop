[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-quest-teleop"
version = "0.2.0"
description = "Multiple Quest browser controllers as an Isaac Lab input device"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "scipy>=1.15,<2", "websockets==15.0.1"]

[project.optional-dependencies]
video = ["aiortc>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_quest_teleop = ["webxr.html"]
